# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0            9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   actions/upload-artifact@v7.0.1     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8.0.1   3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#
name: Release assets

on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag and release name
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease (preview)
        required: false
        type: boolean
        default: false
      target_commitish:
        description: Commit SHA or branch for the release tag (preview builds)
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CI_GO_VERSION: "1.26.5"
  CI_TASK_VERSION: "3.46.3"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOSUMDB: "off"
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build (${{ matrix.goos }}, ${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: 386}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm}
          - {goos: linux, goarch: riscv64}
          - {goos: linux, goarch: ppc64le}
          - {goos: linux, goarch: s390x}
          - {goos: linux, goarch: loong64}
          - {goos: linux, goarch: mips64le}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: 386}
          - {goos: windows, goarch: arm64}
          - {goos: freebsd, goarch: amd64}
          - {goos: freebsd, goarch: arm64}
          - {goos: freebsd, goarch: 386}
          - {goos: freebsd, goarch: arm}
          - {goos: openbsd, goarch: amd64}
          - {goos: openbsd, goarch: arm64}
          - {goos: openbsd, goarch: 386}
          - {goos: openbsd, goarch: arm}
          - {goos: openbsd, goarch: riscv64}
          - {goos: openbsd, goarch: ppc64}
          - {goos: netbsd, goarch: amd64}
          - {goos: netbsd, goarch: arm64}
          - {goos: netbsd, goarch: 386}
          - {goos: netbsd, goarch: arm}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup toolchain
        run: sh scripts/ci/setup-ci-toolchain.sh

      - name: Build gorrcd
        env:
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          VERSION: ${{ inputs.tag_name }}
        run: sh scripts/ci/build-gorrcd.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" bin

      - name: Build golxmd
        env:
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          VERSION: ${{ inputs.tag_name }}
        run: sh scripts/ci/build-golxmd.sh "${{ matrix.goos }}" "${{ matrix.goarch }}" bin

      - name: Upload gorrcd artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gorrcd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/gorrcd-*
          if-no-files-found: error

      - name: Upload golxmd artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golxmd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/golxmd-*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: merged
          merge-multiple: true

      - name: Create release with assets and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TARGET: ${{ inputs.target_commitish }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          shopt -s nullglob
          mapfile -t assets < <(find merged -type f | LC_ALL=C sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release files under merged/" >&2
            find merged -type f -print >&2 || true
            exit 1
          fi
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${tag}" \
            -f target_commitish="${RELEASE_TARGET:-${GITHUB_SHA}}" \
            --jq .body > "${notes}.gen" || true
          {
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              echo "**Preview release**: automated weekly snapshot from \`master\`. Not a stable release; use tagged \`v*\` releases for production."
              echo
              echo "Tag: \`${tag}\`"
              echo "Commit: [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
              echo
            fi
            if [ -s "${notes}.gen" ]; then
              cat "${notes}.gen"
            else
              echo "Release ${tag}"
            fi
            echo
            echo "## SHA256 digests"
            echo
            echo '```'
            find merged -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            echo '```'
          } > "$notes"
          rm -f "${notes}.gen"
          args=(
            --repo "${GITHUB_REPOSITORY}"
            --title "${tag}"
            --notes-file "$notes"
          )
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ -n "${RELEASE_TARGET}" ]; then
            args+=(--target "${RELEASE_TARGET}")
          elif [ "${RELEASE_PRERELEASE}" != "true" ]; then
            args+=(--verify-tag)
          fi
          gh release create "${tag}" "${args[@]}" "${assets[@]}"
