name: Feature request
description: Propose new behavior or an enhancement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Note protocol compatibility and Python reference parity when relevant.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Wire / compatibility impact
      options:
        - No wire or API change
        - Go-only extension (Python reference unchanged)
        - Should match Python reference behavior
        - Unknown / needs discussion
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: extra
    attributes:
      label: Additional context
